/* ===== v2 design ===== */
:root{--bg:#F3EFE3;--cd:#FBF9F4;--be:#E6DFCC;--ol:#3F4523}
body{background:var(--bg)}
h1,h2,h3,.logo{font-family:'Playfair Display',Georgia,serif;font-weight:500;letter-spacing:-.01em}
h1{font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.05}h2{font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.1}

.hdr{background:var(--bg);box-shadow:none;border:0}.hdr .nav{height:80px;gap:20px}.hdr .nav img{height:54px}
.hdr .links{margin:0 auto;gap:34px}.hdr .links a{font-size:11.5px;letter-spacing:.2em;border-bottom:1px solid transparent;padding:6px 0}.hdr .links a.act{border-color:var(--tx);opacity:1}
.ico{display:flex;gap:4px;align-items:center}.ib{width:42px;height:42px;display:grid;place-items:center;border:0;background:none;color:var(--tx);cursor:pointer;position:relative;border-radius:50%;text-decoration:none;font-size:20px;padding:0}.ib:hover{background:var(--be)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bag .cnt{position:absolute;top:1px;right:-1px;margin:0;background:var(--ol);color:#fff;font-size:10px;line-height:16px;padding:0 5px;border-radius:9px}

.eb{font-size:11.5px;letter-spacing:.24em}

.fs{background:#F8F5EC;border-top:1px solid var(--be);border-bottom:1px solid var(--be)}
.fs-g{display:grid;grid-template-columns:repeat(4,1fr);padding-top:0;padding-bottom:0}
.fs-g div{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 12px;text-align:center;border-right:1px solid var(--be);font-size:11px;letter-spacing:.2em;text-transform:uppercase;line-height:1.6}.fs-g div:last-child{border:0}
.fs svg{width:38px;height:38px;fill:none;stroke:var(--ol);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* feature */
.ft2{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#F6F2E7}
.ft2-img{position:relative;min-height:520px;border-radius:0 0 0 clamp(90px,16vw,230px);overflow:hidden}.ft2-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:26px;top:26px;width:100px;height:100px}
.ft2-tx{position:relative;padding:70px clamp(24px,6vw,96px);display:flex;flex-direction:column;justify-content:center}.ft2-tx p{max-width:380px;opacity:.85}
.ft2-tx h2 em{display:block}
.chk{list-style:none;padding:0;margin:14px 0 26px}.chk li{display:flex;gap:12px;align-items:center;padding:6px 0;font-size:14px}.chk li:before{content:'✓';flex:none;width:22px;height:22px;border-radius:50%;background:var(--ol);color:#fff;display:grid;place-items:center;font-size:11px}
.sc2{position:absolute;right:clamp(20px,5vw,80px);top:60px;text-align:center}
/* bundles */
.bd{background:radial-gradient(120% 140% at 0% 0%,#5A6130 0,#3C4220 55%,#2E331A 100%);color:#F3EFE3;padding:64px 0}
.bd-in{display:grid;grid-template-columns:minmax(200px,.7fr) 2.3fr;gap:44px;align-items:center}.bd-tx p{opacity:.85}.bd .eb{color:#D8D2B6}.bd h2 em{display:block}
.bd .btn.o{color:#F3EFE3;border-color:rgba(243,239,227,.7)}.bd .btn.o:hover{background:#F3EFE3;color:var(--ol)}.bd-r{min-width:0}
.pc{background:#F7F4EA;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 36px -26px rgba(0,0,0,.5);color:var(--tx)}
.pc-i{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--be);cursor:pointer}.pc-i img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}.pc:hover .pc-i img{transform:scale(1.04)}
.pc-tag{position:absolute;top:10px;right:10px;z-index:1;background:var(--ol);color:#F3EFE3;font-size:10px;letter-spacing:.1em;padding:5px 10px;border-radius:6px;font-weight:500}
.pc-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}.pc-n{font-size:13px;cursor:pointer}.pc-p{display:flex;gap:10px;align-items:baseline;font-size:15px}.pc-p b{font-weight:500}.pc-p s{opacity:.5;font-size:12px}
.pc-btn{margin-top:auto;display:flex;justify-content:center;align-items:center;gap:10px;border:1px solid var(--ol);background:none;border-radius:30px;padding:10px;font:500 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--tx);transition:background .2s,color .2s}.pc-btn:hover{background:var(--ol);color:#F3EFE3}
.pc-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.rail>.pc{flex:0 0 clamp(220px,24vw,270px);scroll-snap-align:start}
/* newsletter */
.nl2{background:#F8F5EC;border-top:1px solid var(--be);padding:40px 0}.nl2-in{display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap}
.nl2-t small{font-size:10.5px;letter-spacing:.22em;opacity:.7}.nl2-t h3{font-size:1.7rem;font-style:italic;margin:4px 0}.nl2-t p{margin:0;font-size:13px;opacity:.75}
.nl2-f{flex:1;min-width:280px;max-width:520px}.nl2-f form{display:flex;gap:10px}.nl2-f input{flex:1;border-radius:30px;background:#fff}
/* footer */
footer.ft{background:var(--bg);color:var(--tx);margin:0;border-radius:0;padding:36px 0 26px;border-top:1px solid var(--be);font-size:13px}
.ft a{display:inline;margin:0;color:inherit;opacity:.85;text-decoration:none}.ft a:hover{opacity:1;text-decoration:underline}
.ft-top{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.ft-top .lg{display:flex;flex-direction:column;gap:4px}.ft-top img{height:48px;width:auto;margin:0}.ft-top small{font-size:8.5px;letter-spacing:.3em;opacity:.7}
.ft nav{display:flex;gap:26px;flex-wrap:wrap;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.ft-b{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--be);margin-top:24px;padding-top:18px;font-size:12px;opacity:.9}.ft-b nav{font-size:11px}
/* product/shop touch-ups */
.pimg{aspect-ratio:4/5;object-fit:cover;border-radius:24px}.two img.pimg{border-radius:24px}
@media(max-width:900px){
.hdr .nav{height:68px}.hdr .nav img{height:44px}#bg{display:grid}
.hdr .links{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;gap:4px;padding:14px clamp(22px,6vw,84px) 22px;margin:0;border-bottom:1px solid var(--be);box-shadow:0 24px 40px -28px rgba(41,41,31,.35)}.hdr .links.open{display:flex}.hdr .links a{font-size:13px;padding:12px 0;border:0}.hdr .links a.act{font-weight:500}
.ico{margin-left:auto}
.hx{display:block;min-height:0}.hx-bg{position:relative;width:100%;height:min(86vw,420px)}.hx-bg img{-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}
.hx-tx{padding:6px 0 46px;max-width:none}.hx .scr{display:none}
.fs-g{grid-template-columns:1fr 1fr}.fs-g div:nth-child(2){border-right:0}.fs-g div:nth-child(-n+2){border-bottom:1px solid var(--be)}
.ft2{grid-template-columns:1fr}.ft2-img{min-height:380px;border-radius:0 0 0 110px}.ft2-tx{padding:44px 24px 50px}.sc2{display:none}
.bd{padding:48px 0}.bd-in{grid-template-columns:1fr;gap:26px}.rail>.pc{flex-basis:70%}
.nl2-in{flex-direction:column;align-items:stretch;text-align:center}.nl2 .scr{display:none}.nl2-f{max-width:none}
.ft-top,.ft-b{justify-content:center;text-align:center}.ft-top .lg{align-items:center}
}
@media(max-width:480px){.nl2-f form{flex-direction:column}.nl2-f form .btn{width:100%}.btn{padding:15px 24px}.ft nav{gap:16px;justify-content:center}}

.rail>.pc{flex:0 0 clamp(210px,calc((100% - 56px)/3),290px)}.rail-w.ns .ra{display:none}
.w.sec{padding-left:clamp(22px,6vw,84px);padding-right:clamp(22px,6vw,84px)}
@media(max-width:900px){.rail>.pc{flex-basis:70%}}
