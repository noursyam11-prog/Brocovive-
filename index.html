story:()=>`<div class="w sec"><div class="two"><div><span class="eb">Our story</span><h1>Botany, <em>thoughtfully</em> made.</h1><p>Brocovive is a premium botanical skincare brand inspired by broccoli and sulforaphane. We believe skincare should feel calm, natural and modern, while staying curious about science.</p><p>Broccoli is our recognizable symbol: a humble plant that inspires a refined approach to botanical care.</p><a class="btn" href="#/shop">Shop the serum</a></div><img class="pimg" src="${IMG.hero}" alt=""></div></div><div class="w" style="padding-bottom:40px"><div class="grid pil"><div class="rvc"><span class="eb">01</span><h3>Botanical inspiration</h3><p>Broccoli guides our visual world and our point of view.</p></div><div class="rvc"><span class="eb">02</span><h3>Science-aware</h3><p>We stay curious and careful, and we never overstate what is known.</p></div><div class="rvc"><span class="eb">03</span><h3>Calm &amp; modern</h3><p>Simple, refined skincare that feels good to use.</p></div></div></div>`,
science:()=>`<div class="w sec" style="padding-bottom:30px"><div style="max-width:720px"><span class="eb">The science</span><h1>Broccoli, <em>explained</em> simply.</h1><p>An accessible, evidence-aware introduction. It is educational only and not medical advice.</p></div></div><div class="w" style="padding-bottom:40px"><div class="grid pil"><div class="rvc"><span class="eb">01</span><h3>What is sulforaphane?</h3><p>A naturally occurring compound found in cruciferous vegetables such as broccoli. It is widely studied in nutrition and laboratory research.</p></div><div class="rvc"><span class="eb">02</span><h3>Where it comes from</h3><p>It forms from a precursor in broccoli when the plant is chopped or chewed, which is one reason researchers find it interesting.</p></div><div class="rvc"><span class="eb">03</span><h3>What we do not claim</h3><p>Research interest does not automatically mean skincare results. Findings on topical use are still developing, so this demo site makes no clinical claims.</p></div></div></div>`,
reviews(){const f=ls.get('bv_rf','0'),s=ls.get('bv_rs','new');let L=R.filter(x=>x.r>=+f);L.sort((a,b)=>s=='hi'?b.r-a.r:s=='lo'?a.r-b.r:b.d-a.d);return`<div class="w sec"><h1>Reviews</h1><p class="demo">Sample reviews — demo placeholders only</p><div class="row" style="margin:16px 0"><select id="rf" style="width:auto"><option value="0">All ratings</option>${[5,4,3].map(n=>`<option value="${n}" ${f==n?'selected':''}>${n}+ stars</option>`).join('')}</select><select id="rs" style="width:auto"><option value="new">Newest</option><option value="hi" ${s=='hi'?'selected':''}>Highest</option><option value="lo" ${s=='lo'?'selected':''}>Lowest</option></select></div><div class="grid">${L.map(rv).join('')||'<p>No reviews match.</p>'}</div><h2 style="margin-top:48px">Write a review</h2><form id="rfm" novalidate style="max-width:520px"><label>Name</label><input id="rn"><div class="err" id="e1"></div><label>Rating</label><select id="rr"><option value="">Select</option>${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><div class="err" id="e2"></div><label>Review</label><textarea id="rt" rows="4"></textarea><div class="err" id="e3"></div><button class="btn">Submit (demo)</button></form><div id="ro"></div></div>`},
cart(){const L=lines();if(!L.length)return`<div class="w sec" style="text-align:center"><h1>Your cart is empty</h1><p>Nothing here yet.</p><a class="btn" href="#/shop">Continue shopping</a></div>`;const t=totals();return`<div class="w sec"><h1>Cart</h1>${L.map(l=>`<div class="ci"><img src="${img(l.p)}" alt=""><div><b>${esc(l.p.name)}</b><div>${egp(l.p.price)}</div><div class="qty" style="margin-top:6px"><button onclick="setq('${l.p.id}',${l.q-1})">−</button><span>${l.q}</span><button onclick="setq('${l.p.id}',${l.q+1})">+</button></div></div><div style="text-align:right">${egp(l.p.price*l.q)}<br><button class="ic" style="font-size:13px;text-decoration:underline" onclick="setq('${l.p.id}',0)">Remove</button></div></div>`).join('')}<div class="sumc" style="max-width:400px;margin-left:auto;margin-top:28px">${sm(t)}<a class="btn" style="width:100%;text-align:center" href="#/checkout">Checkout (demo)</a><p><a href="#/shop">← Continue shopping</a></p></div></div>`},
checkout(){const L=lines();if(!L.length){location.hash='#/cart';return''}const t=totals();const f=(i,l,ty='text')=>`<label>${l}</label><input id="${i}" type="${ty}"><div class="err" id="e_${i}"></div>`;return`<div class="w sec two" style="align-items:start"><form id="cf" novalidate class="fcard"><h1>Checkout</h1><p class="demo">Demo only — no payment is collected and no real order is placed.</p>${f('fn','Full name')}${f('em','Email','email')}${f('ph','Phone')}${f('ad','Street address')}${f('ct','City')}${f('gv','Governorate')}<br><button class="btn">Place Demo Order</button></form><div class="sumc"><h2>Summary</h2>${L.map(l=>`<div class="tot"><span>${esc(l.p.name)} × ${l.q}</span><span>${egp(l.p.price*l.q)}</span></div>`).join('')}${sm(t)}</div></div>`},
confirm(){const o=ls.get('bv_o',null);if(!o)return nf();return`<div class="w sec" style="max-width:860px"><div class="cf-top"><div class="cf-ok">✓</div><span class="eb">Demo order</span><h1>Thank you, <em>${esc(o.c.fn.split(' ')[0])}</em></h1><p>This was a demo. No real order was placed and no payment was taken.</p><div class="cf-ref"><span>Reference</span><b>${o.ref}</b><button class="btn s o" onclick="navigator.clipboard&&navigator.clipboard.writeText('${o.ref}');toast('Reference copied')">Copy</button></div></div><div class="two" style="align-items:start"><div class="fcard"><h3>Your items</h3>${o.L.map(l=>`<div class="tot"><span>${esc(l.name)} × ${l.q}</span><span>${egp(l.price*l.q)}</span></div>`).join('')}<div class="tot"><span>Shipping (demo)</span><span>${egp(o.t.sh)}</span></div><div class="tot g"><span>Total</span><span>${egp(o.t.total)}</span></div></div><div class="fcard"><h3>Delivery details</h3><p style="margin:0">${esc(o.c.fn)}<br>${esc(o.c.ad)}<br>${esc(o.c.ct)}, ${esc(o.c.gv)}</p><p style="opacity:.8;margin-bottom:0">${esc(o.c.em)}<br>${esc(o.c.ph)}</p></div></div><div class="row" style="justify-content:center;margin-top:32px"><a class="btn" href="#/shop">Continue shopping</a><a class="btn o" href="#/">Back to home</a></div></div>`},
contact:()=>`<div class="w sec" style="max-width:640px"><span class="eb">Contact</span><h1>Get in <em>touch</em></h1><p class="demo">Demo form: nothing is sent anywhere.</p><form id="ctf" novalidate class="fcard"><label>Name</label><input id="cn"><label>Email</label><input id="ce" type="email"><label>Message</label><textarea id="cm" rows="4"></textarea><div class="err" id="cer"></div><button class="btn">Send (demo)</button></form><div id="cto"></div></div>`,
policy(k){const T={shipping:['Shipping','Demo placeholder: shipping rates and times will be defined before launch.'],returns:['Returns','Demo placeholder: return policy will be defined before launch.'],privacy:['Privacy','This demo stores cart and settings only in your own browser (localStorage). Nothing is sent anywhere.']}[k];return T?`<div class="w sec" style="max-width:720px"><span class="eb">Policy</span><h1>${T[0]}</h1><div class="fcard"><p>${T[1]}</p></div></div>`:nf()},
admin(){if(!auth())return`<div class="w sec" style="max-width:460px"><span class="eb">Admin</span><h1>Sign <em>in</em></h1><form id="lf" novalidate class="fcard"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="le"></div><button class="btn">Sign in</button><p style="font-size:12px;opacity:.7;margin-bottom:0">Demo protection only. Stored in this browser.</p></form></div>`;
return`<div class="w sec"><div class="hd"><div><span class="eb">Admin</span><h1 style="margin:0">Manage <em>products</em></h1></div><button class="btn s o" onclick="logout()">Log out</button></div><p>Change names, prices and images. Everything saves automatically and applies across the whole site.</p>${heroForm()}<div class="fcard" style="padding:12px 20px;overflow-x:auto"><table><tr><th>Image</th><th>Name</th><th>Price</th><th>Was</th><th>Serums</th><th></th></tr>${P.map(p=>`<tr><td><div class="row" style="flex-wrap:nowrap;min-width:230px"><img src="${img(p)}" alt="" style="width:56px;height:56px;border-radius:14px;object-fit:cover"><button class="btn s o" onclick="this.parentNode.querySelector('input').click()">Edit image</button><input type="file" accept="image/*" hidden onchange="upl('${p.id}',this)">${p.img!=='main'?`<button class="ic" style="font-size:12px;text-decoration:underline" onclick="rimg('${p.id}')">Reset</button>`:''}</div></td><td><input value="${esc(p.name)}" style="min-width:180px" onchange="ed('${p.id}','name',this.value)"></td><td><input type="number" min="0" value="${p.price}" style="width:96px" onchange="ed('${p.id}','price',+this.value)"></td><td><input type="number" min="0" value="${p.ref}" style="width:96px" onchange="ed('${p.id}','ref',+this.value)"></td><td><input type="number" min="1" value="${p.n}" style="width:76px" onchange="ed('${p.id}','n',+this.value)"></td><td><button class="btn s o" onclick="del('${p.id}')">Delete</button></td></tr>`).join('')}</table></div><div class="two" style="align-items:start;margin-top:32px"><form id="af" novalidate class="fcard"><h2>Add product</h2><label>Name</label><input id="an"><label>Price (EGP)</label><input id="ap" type="number" min="0"><label>Description</label><textarea id="ad2" rows="3"></textarea><div class="err" id="aer"></div><button class="btn">Add product</button></form><form id="pwf" novalidate class="fcard"><h2>Change password</h2><label>Current password</label><input id="op" type="password"><label>New password</label><input id="np" type="password"><label>Repeat new password</label><input id="np2" type="password"><div class="err" id="pe"></div><button class="btn">Update password</button></form></div><p style="margin-top:28px"><button class="btn s o" onclick="if(confirm('Reset all demo data?')){localStorage.clear();sessionStorage.clear();location.reload()}">Reset demo data</button></p></div>`}};
const sm=t=>`${t.sav?`<div class="tot sv"><span>Bundle savings</span><span>${egp(t.sav)}</span></div>`:''}<div class="tot"><span>Subtotal</span><span>${egp(t.sub)}</span></div><div class="tot"><span>Shipping <small>(demo placeholder)</small></span><span>${egp(t.sh)}</span></div><div class="tot g"><span>Total</span><span>${egp(t.total)}</span></div>`;
const rv=r=>`<div class="rvc"><div class="st">${stars(r.r)}</div><p>“${esc(r.t)}”</p><div class="who"><span class="av">${esc((r.n[0]||'?').toUpperCase())}</span><small><b>${esc(r.n)}</b><br>Demo review</small></div></div>`;
const nf=()=>`<div class="w sec"><h1>Page not found</h1><a class="btn" href="#/">Back home</a></div>`;
window.ed=(id,k,v)=>{const p=gp(id);if(k=='name'&&!v.trim())return route();if(['price','ref','n'].includes(k)&&!(v>=0))return route();p[k]=v;save();toast('Saved')}
window.del=id=>{if(P.length<2)return toast('Keep at least one product');P=P.filter(p=>p.id!==id);delete C[id];save();badge();route()}
window.upl=(id,el)=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,700/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);gp(id).img=c.toDataURL('image/jpeg',.8);save();route()};i.src=r.result};r.readAsDataURL(f)}
function bind(){const g=id=>document.getElementById(id);
if(g('gl')){const draw=()=>{const q=g('sq').value.trim().toLowerCase(),s=g('ss').value;ls.set('bv_q',g('sq').value);ls.set('bv_s',s);let L=P.filter(p=>(p.name+p.desc).toLowerCase().includes(q));if(s)L.sort((a,b)=>s=='a'?a.price-b.price:b.price-a.price);g('gl').innerHTML=L.length?`<div class="grid">${L.map(card).join('')}</div>`:'<p>No products match your search.</p>'};g('sq').oninput=g('ss').onchange=draw;draw()}
if(g('nl'))g('nl').onsubmit=e=>{e.preventDefault();const v=g('ne').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){g('ner').textContent='Enter a valid email address.';return}g('ner').textContent='';g('nlo').innerHTML='<div class="ok">Demo only: thanks! Nothing was sent or saved.</div>';g('ne').value=''}
if(g('rf')){g('rf').onchange=()=>{ls.set('bv_rf',g('rf').value);route()};g('rs').onchange=()=>{ls.set('bv_rs',g('rs').value);route()};g('rfm').onsubmit=e=>{e.preventDefault();const n=g('rn').value.trim(),r=g('rr').value,t=g('rt').value.trim();g('e1').textContent=n?'':'Name is required.';g('e2').textContent=r?'':'Choose a rating.';g('e3').textContent=t.length>=10?'':'Review must be at least 10 characters.';if(!n||!r||t.length<10)return;R.unshift({n,r:+r,t,d:Date.now()});save();route();document.getElementById('ro').innerHTML='<div class="ok">Demo only: your review was added in this browser only.</div>'}}
if(g('cf'))g('cf').onsubmit=e=>{e.preventDefault();const rules={fn:[v=>v.length>=2,'Enter your full name.'],em:[v=>/^\S+@\S+\.\S+$/.test(v),'Enter a valid email.'],ph:[v=>/^[+\d][\d\s-]{7,}$/.test(v),'Enter a valid phone number.'],ad:[v=>v.length>=5,'Enter your street address.'],ct:[v=>v.length>=2,'Enter your city.'],gv:[v=>v.length>=2,'Enter your governorate.']};let ok=true;const c={};for(const k in rules){const v=g(k).value.trim();c[k]=v;const good=rules[k][0](v);g('e_'+k).textContent=good?'':rules[k][1];if(!good)ok=false}if(!ok){toast('Please fix the highlighted fields');return}const b=e.target.querySelector('.btn');b.disabled=true;b.textContent='Placing demo order…';setTimeout(()=>{ls.set('bv_o',{ref:'BV-DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase(),c,t:totals(),L:lines().map(l=>({name:l.p.name,price:l.p.price,q:l.q}))});C={};save();badge();location.hash='#/confirm'},600)}
if(g('ctf'))g('ctf').onsubmit=e=>{e.preventDefault();const ok=g('cn').value.trim()&&/^\S+@\S+\.\S+$/.test(g('ce').value)&&g('cm').value.trim().length>=10;g('cer').textContent=ok?'':'Please enter your name, a valid email and a message (10+ characters).';if(ok){g('cto').innerHTML='<div class="ok">Demo only: message not sent anywhere.</div>';e.target.reset()}}
if(g('af'))g('af').onsubmit=e=>{e.preventDefault();const n=g('an').value.trim(),p=+g('ap').value;if(!n||!(p>0)){g('aer').textContent='Enter a name and a price above 0.';return}P.push({id:'p'+Date.now(),name:n,price:p,ref:0,n:1,desc:g('ad2').value.trim()||'Demo product.',img:'main'});save();route()}}
const HD={eb:'Botanical skincare',t1:'Rewind',t2:'your skin.',sub:'Premium botanical skincare inspired by broccoli and sulforaphane. Calm, modern and science-aware.',b1:'Shop the serum',b2:'Our story',img:''};
const hd=()=>({...HD,...ls.get('bv_h',{})});
window.hset=(k,v)=>{const o=ls.get('bv_h',{});v=v.trim();if(v)o[k]=v;else delete o[k];ls.set('bv_h',o);toast('Saved')};
window.hreset=()=>{try{localStorage.removeItem('bv_h')}catch(e){};route()};
window.hup=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1000/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const o=ls.get('bv_h',{});o.img=c.toDataURL('image/jpeg',.82);ls.set('bv_h',o);route()};i.src=r.result};r.readAsDataURL(f)};
const heroForm=()=>{const h=hd();const f=(k,l,ta)=>`<label>${l}</label>${ta?`<textarea rows="3" onchange="hset('${k}',this.value)">${esc(h[k])}</textarea>`:`<input value="${esc(h[k])}" onchange="hset('${k}',this.value)">`}`;
return`<div class="fcard" style="margin-bottom:28px"><h2>Hero section</h2><div class="two" style="align-items:start"><div>${f('eb','Small label')}${f('t1','Title line 1')}${f('t2','Title line 2 (italic)')}${f('sub','Subtitle',1)}${f('b1','Main button text')}${f('b2','Second button text')}</div><div><label>Hero image</label><img src="${h.img||IMG.hero}" alt="" style="width:100%;max-width:280px;border-radius:24px;display:block;margin-bottom:12px"><div class="row"><button class="btn s o" onclick="this.nextElementSibling.click()">Edit image</button><input type="file" accept="image/*" hidden onchange="hup(this)"><button class="btn s o" onclick="hreset()">Reset hero</button></div></div></div></div>`};
let AUTH=false;const auth=()=>AUTH||(()=>{try{return sessionStorage.getItem('bv_a')=='1'}catch(e){return false}})();
const pw=()=>ls.get('bv_pw','Brocovive@2026');
window.logout=()=>{AUTH=false;try{sessionStorage.removeItem('bv_a')}catch(e){};location.hash='#/'};
window.rimg=id=>{gp(id).img='main';save();route()};
function bind2(){const g=id=>document.getElementById(id);
if(g('lf'))g('lf').onsubmit=e=>{e.preventDefault();if(g('lp').value===pw()){AUTH=true;try{sessionStorage.setItem('bv_a','1')}catch(x){};route()}else{g('le').textContent='Incorrect password.';g('lp').value=''}};
if(g('pwf'))g('pwf').onsubmit=e=>{e.preventDefault();const o=g('op').value,n=g('np').value,n2=g('np2').value;const m=o!==pw()?'Current password is incorrect.':n.length<6?'New password must be at least 6 characters.':n!==n2?'New passwords do not match.':'';g('pe').textContent=m;if(m)return;ls.set('bv_pw',n);e.target.reset();toast('Password updated')}}
function route(){const [a,b]=(location.hash.slice(2)||'').split('/');const fn=V[a||'home'];$('#app').innerHTML=fn?fn(b):nf();$('#lk').classList.remove('open');bind();bind2();badge();$('#bkw').style.display=H.length>1?'block':'none'}
$('#bg').onclick=()=>$('#lk').classList.toggle('open');
let H=[location.hash||'#/'],BK=0;window.goBack=()=>{if(H.length>1){H.pop();BK=1;location.hash=H[H.length-1]}};addEventListener('hashchange',()=>{if(BK)BK=0;else{const h=location.hash||'#/';if(H[H.length-1]!==h)H.push(h)}route();scrollTo(0,0)});
route();
</script></body></html>
